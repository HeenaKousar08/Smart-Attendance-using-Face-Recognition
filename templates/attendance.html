<!DOCTYPE html>
<html>
<head>
    <title>Attendance System</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
        }
        h1 {
            background-color: #123750;
            color: white;
            padding: 15px;
        }
        table {
            margin: auto;
            border-collapse: collapse;
            width: 60%;
            background: white;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #1e2961;
            color: white;
        }
        form {
            margin: 20px;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 10px;
            background-color: #3b8d9d;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h1>Face Recognition Attendance System</h1>

<h3>Date: {{ datetoday2 }}</h3>

{% if mess %}
<p style="color:red;">{{ mess }}</p>
{% endif %}

<h2>Add User</h2>
<form action="/add" method="post">
    <input type="text" name="newusername" placeholder="Enter Name" required>
    <input type="text" name="newuserid" placeholder="Enter ID" required>
    <button type="submit">Add User</button>
</form>

<br>

<h2>Start Attendance</h2>
<a href="/start">
    <button>Start Camera</button>
</a>

<br><br>

<h2>Attendance Records</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Roll</th>
        <th>Time</th>
    </tr>

    {% for i in range(l) %}
    <tr>
        <td>{{ names[i] }}</td>
        <td>{{ rolls[i] }}</td>
        <td>{{ times[i] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
